<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScrapeClaude</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <span class="dot"></span><h1>ScrapeClaude</h1>
  <span id="llm"></span>
  <span class="spacer"></span>
  <span id="authBar">
    <a class="btn" href="/docs" target="_blank" rel="noopener">API docs</a>
    <button class="btn" id="loginBtn" type="button">Log in</button>
    <button class="btn" id="logoutBtn" type="button">Log out</button>
  </span>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main>
    <h2 id="title"></h2><p class="sub" id="desc"></p>
    <form class="card" id="form"></form>
    <div class="card" id="out" hidden>
      <div class="meta" id="outMeta"></div>
      <div class="tabs" id="outTabs"></div>
      <pre id="outBody"></pre>
    </div>
  </main>
  <aside>
    <div class="histHead"><b>History</b><button class="btn small" id="refreshBtn" type="button">Refresh</button></div>
    <ul class="hist" id="hist"></ul>
  </aside>
</div>
<dialog id="loginDlg">
  <form id="loginForm">
    <h3>Log in</h3>
    <p class="sub">Enter the value of <code>SC_API_KEY</code> from your server. A session cookie is set for this browser only; the key itself is not stored.</p>
    <input type="password" id="keyInput" placeholder="API key" autocomplete="current-password" required>
    <div class="actions"><button class="btn primary" type="submit">Log in</button></div>
    <div id="loginErr" class="err"></div>
  </form>
</dialog>
<script src="/static/app.js"></script>
</body>
</html>
