<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScrapeClaude</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<section id="loginView" hidden>
  <form id="loginForm" class="card loginCard">
    <div class="brand"><span class="dot"></span><h1>ScrapeClaude</h1></div>
    <p class="sub" id="loginHint">Self-hosted AI web scraper. Sign in to continue.</p>
    <div id="passwordFields">
      <label for="emailInput">Email</label>
      <input type="email" id="emailInput" placeholder="you@example.com" autocomplete="username">
      <label for="passwordInput">Password</label>
      <input type="password" id="passwordInput" placeholder="Password" autocomplete="current-password">
    </div>
    <div id="keyFields" hidden>
      <label for="keyInput">API key</label>
      <input type="password" id="keyInput" placeholder="Paste your API key" autocomplete="current-password">
    </div>
    <div class="actions"><button class="btn primary" type="submit" id="loginSubmit">Sign in</button></div>
    <div id="loginErr" class="err"></div>
    <p class="sub tiny">Signing in creates a session cookie for this browser only. Your credentials are not stored in the browser.</p>
  </form>
</section>
<div id="app" hidden>
<header>
  <span class="dot"></span><h1>ScrapeClaude</h1>
  <span id="llm"></span>
  <span class="spacer"></span>
  <span id="authBar">
    <a class="btn" href="/docs" target="_blank" rel="noopener">API docs</a>
    <button class="btn" id="logoutBtn" type="button">Log out</button>
  </span>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main>
    <h2 id="title"></h2><p class="sub" id="desc"></p>
    <form class="card" id="form"></form>
    <div class="card" id="out" hidden>
      <div class="meta" id="outMeta"></div>
      <div class="tabs" id="outTabs"></div>
      <pre id="outBody"></pre>
    </div>
  </main>
  <aside>
    <div class="histHead"><b>History</b><button class="btn small" id="refreshBtn" type="button">Refresh</button></div>
    <ul class="hist" id="hist"></ul>
  </aside>
</div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
