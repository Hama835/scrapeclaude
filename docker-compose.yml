services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/scrapeclaude.db
      BROWSER_WS_URL: ws://browser:3000/
      # Caddy is the only client that can reach this container, so trust its X-Forwarded-* headers.
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - ./data:/app/data
    # Only reachable from the VPS itself; Caddy (below) is the public entry point.
    ports:
      - "127.0.0.1:8000:8000"
    mem_limit: "2g"
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=512m
      - /home/scraper:size=256m,uid=1000,gid=1000,mode=0700
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      - browser

  # Headless Chromium in its own container: it holds no secrets, so a browser exploit
  # cannot read the Claude token or the API key. The app connects over the Docker network.
  browser:
    image: mcr.microsoft.com/playwright:v1.64.0-noble
    restart: unless-stopped
    init: true
    user: pwuser
    working_dir: /home/pwuser
    command: ["npx", "-y", "playwright@1.64.0", "run-server", "--port", "3000", "--host", "0.0.0.0"]
    shm_size: "1gb"          # Chromium needs shared memory
    mem_limit: "2g"
    pids_limit: 1024
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./deploy/seccomp_profile.json   # lets Chromium create its sandbox (user namespaces)

  # HTTPS reverse proxy with automatic Let's Encrypt certificates.
  # Remove this service if you only access the app over an SSH tunnel or Tailscale.
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    depends_on:
      - app

volumes:
  caddy_data:
